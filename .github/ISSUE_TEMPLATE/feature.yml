name: Feature request
description: Suggest a change or a new capability
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: What you were doing when the tool fell short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
    validations:
      required: true
  - type: checkboxes
    id: willing
    attributes:
      label: Are you willing to submit a pull request?
      options:
        - label: Yes, I'd like to try
